<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#231f20">
  <title>N-Cube | Interactive Explorer</title>
  <link rel="icon" type="image/svg+xml" href="TemplateData/favicon.svg">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #231f20; box-sizing: border-box; }
    body { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #231f20; touch-action: none; }
    #unity-status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #231f20; color: #e9edf1; font: 16px/1.5 system-ui, sans-serif; text-align: center; pointer-events: none; }
    #unity-status[hidden] { display: none; }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-status" role="status" aria-live="polite">Loading N-Cube…</div>
  <script src="Build/NCube-Online.loader.js?v=c0b9ec148b22"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const status = document.querySelector('#unity-status');
    const showError = (error) => {
      status.textContent = 'N-Cube could not start. Try a hard refresh (Ctrl+Shift+R). ' + error;
    };
    if (typeof createUnityInstance !== 'function') {
      showError('The Unity loader did not download.');
    } else {
      const slowLoad = setTimeout(() => {
        status.textContent = 'N-Cube is taking longer than expected to load. Try a hard refresh (Ctrl+Shift+R).';
      }, 90000);
      try {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: 'Build/NCube-Online.data?v=c0b9ec148b22',
          frameworkUrl: 'Build/NCube-Online.framework.js?v=c0b9ec148b22',
          codeUrl: 'Build/NCube-Online.wasm?v=c0b9ec148b22',
          streamingAssetsUrl: 'StreamingAssets',
          companyName: "DefaultCompany",
          productName: "Cube Projection",
          productVersion: "0.1",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
        }, (progress) => {
          status.textContent = 'Loading N-Cube… ' + Math.round(progress * 100) + '%';
        }).then(() => {
          clearTimeout(slowLoad);
          status.hidden = true;
        }).catch((error) => {
          clearTimeout(slowLoad);
          showError(error);
        });
      } catch (error) {
        clearTimeout(slowLoad);
        showError(error);
      }
    }
  </script>
</body>
</html>
