<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#231f20">
  <title>N-Cube | Interactive Explorer</title>
  <link rel="icon" type="image/svg+xml" href="TemplateData/favicon.svg">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #231f20; box-sizing: border-box; }
    body { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #231f20; touch-action: none; }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script src="Build/NCube-Online.loader.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: 'Build/NCube-Online.data',
      frameworkUrl: 'Build/NCube-Online.framework.js',
      codeUrl: 'Build/NCube-Online.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Cube Projection",
      productVersion: "0.1",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }).catch((error) => {
      const message = document.createElement('p');
      message.textContent = 'N-Cube could not start: ' + error;
      message.style.cssText = 'color:white;font:16px sans-serif;padding:24px';
      document.body.appendChild(message);
    });
  </script>
</body>
</html>
